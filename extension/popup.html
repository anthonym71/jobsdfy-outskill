<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 320px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0F1419; color: #E8E6E1; padding: 20px; }
    h1 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .subtitle { font-size: 12px; color: #8B8680; margin-bottom: 16px; }
    label { font-size: 12px; color: #8B8680; display: block; margin-bottom: 4px; }
    input { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid #2A2520; background: #1A1F26; color: #E8E6E1; font-size: 13px; margin-bottom: 12px; outline: none; }
    input:focus { border-color: #1B2A4A; }
    .btn { width: 100%; padding: 10px; border-radius: 8px; border: none; background: #1B2A4A; color: #E8E6E1; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn:hover { background: #243556; }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .status { font-size: 11px; color: #8B8680; margin-top: 8px; text-align: center; }
    .status.success { color: #22C55E; }
    .status.error { color: #EF4444; }
    .saved { display: flex; align-items: center; gap: 6px; padding: 8px 10px; background: #1A1F26; border-radius: 8px; margin-bottom: 12px; font-size: 12px; color: #8B8680; }
    .saved .url { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #E8E6E1; }
    .saved button { background: none; border: none; color: #8B8680; cursor: pointer; font-size: 11px; }
    .saved button:hover { color: #E8E6E1; }
  </style>
</head>
<body>
  <h1>JobsDFY</h1>
  <p class="subtitle">Send job pages directly to your pipeline</p>
  
  <div id="config-section" style="display:none">
    <label>Your JobsDFY URL</label>
    <input type="url" id="app-url" placeholder="https://www.jobsdfy.com" value="https://www.jobsdfy.com">
    <button class="btn" id="save-btn">Save & Connect</button>
  </div>

  <div id="connected-section" style="display:none">
    <div class="saved">
      <span class="url" id="saved-url"></span>
      <button id="edit-btn">Edit</button>
    </div>
    <button class="btn" id="send-btn">Send This Page</button>
    <p style="font-size:11px;color:#8B8680;margin-top:8px;line-height:1.4;">💡 Navigate to a <strong style="color:#E8E6E1;">specific job posting page</strong> first (e.g. linkedin.com/jobs/view/…), then click Send.</p>
  </div>

  <p class="status" id="status"></p>

  <script src="popup.js"></script>
</body>
</html>
